[project]
name = "acessorIA"
version = "2.0.0"
requires-python = "==3.14.*"
dependencies = [
    "google-genai>=1.68.0",
    "langchain>=1.2.14",
    "langchain-google-genai>=4.2.1",
    "langchain-groq>=1.1.1",
    "pydantic-settings>=2.13.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.4.1",
    "pypdf>=6.10.2",
    "rich>=15.0.0",
    "beanie>=2.1.0",
    "pymongo>=4.9.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.9",
    "tzdata>=2026.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "qdrant-client>=1.19.0",
    "dishka>=1.10.1",
    "mcp[cli]>=2.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff==0.15.19",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "testcontainers>=4.0",
    "mypy>=2.1.0",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
pythonpath = ". app"
markers = [
    "integration: testes que dependem de container Docker (PostgreSQL)",
]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
exclude = ["migrations/", "tests/", "app/legacy-main.py"]
